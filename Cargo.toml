[workspace]
resolver = "3"
members = ["crates/core", "app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

# Lean debug builds: dependencies without debug info, our code with line numbers only
# (same as Palette).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
